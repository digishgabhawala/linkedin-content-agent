[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "B008",   # FastAPI's Depends(...)-as-default-arg is the documented DI pattern, not a bug
    "DTZ003", # datetime.utcnow() is used consistently (naive UTC) across every DB column in
              # db/models.py -- switching only some call sites to tz-aware would break
              # naive/aware comparisons (e.g. image_service.is_stalled). A full migration to
              # tz-aware datetimes is a real change, not a lint fix; revisit deliberately.
]
